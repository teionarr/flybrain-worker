[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyworker"
version = "0.1.0"
description = "Don't hire people. Don't hire AI. Hire a fly. A sarcastic worker that never finishes the ticket."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "teionarr" }]
dependencies = [
    "numpy>=1.24",
    "flask>=3.0",
    "flybrain-sdk @ git+https://github.com/freeman-1984-coder/flybrain-sdk.git",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flyworker = "flyworker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
